{% extends 'inventory/base.html' %}

{% block title %}Confirm Delete | SmartStock Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 text-center shadow-sm">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill display-3"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">Delete {{ type }}?</h4>
            <p class="text-muted mb-4">
                Are you sure you want to delete <strong>"{{ object }}"</strong>? This action cannot be undone.
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'product_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                        <i class="bi bi-trash me-1"></i> Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
