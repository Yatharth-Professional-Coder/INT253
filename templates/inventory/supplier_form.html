{% extends 'inventory/base.html' %}

{% block title %}{{ title }} | SmartStock Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <a href="{% url 'supplier_list' %}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Back to Suppliers</a>
                <h2 class="page-title mt-1">{{ title }}</h2>
            </div>
        </div>

        <div class="card card-custom p-4 shadow-sm">
            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Supplier / Company Name *</label>
                        {{ form.name }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Contact Person</label>
                        {{ form.contact_name }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Phone Number *</label>
                        {{ form.phone }}
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Email Address</label>
                        {{ form.email }}
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Address / Warehouse Location</label>
                        {{ form.address }}
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Notes / Payment Terms</label>
                        {{ form.notes }}
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{% url 'supplier_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check2 me-1"></i> Save Supplier
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
